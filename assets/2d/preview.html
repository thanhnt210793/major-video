<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thư viện 2D — xem nhanh</title>
<style>
  :root { --bg: #0F1E33; --card: #1B2E4A; --text: #F5EFE4; --muted: #B8C4D3; --teal: #14B8A6; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  figure { margin: 0; background: var(--card); border-radius: 12px; padding: 10px; }
  figcaption { color: var(--muted); font-size: 13px; margin-top: 6px; max-width: 270px; }
  /* scenes are 1080×1920 canvases shown at 25% */
  .scene { position: relative; width: 270px; height: 480px; overflow: hidden; border-radius: 8px; }
  .scene img { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: scale(0.25); }
  .item { display: grid; place-items: center; width: 140px; height: 140px; background: var(--bg); border-radius: 8px; }
  .item img { max-width: 120px; max-height: 120px; }
  .icons { display: flex; flex-wrap: wrap; gap: 10px; max-width: 600px; color: var(--teal); }
  .icons span { display: grid; place-items: center; width: 64px; height: 64px; background: var(--text); border-radius: 8px; }
  .icons img { width: 40px; height: 40px; }
</style>
</head>
<body>
<h1>Thư viện 2D dùng chung</h1>
<p>Xem trước các hình trong <code>assets/2d/</code>. Ghép lớp theo thứ tự trong README.md. Mở bằng trình duyệt để xem.</p>

<div class="row">
  <figure>
    <div class="scene">
      <img src="backgrounds/office-wall-wide.svg" alt="">
      <img src="backgrounds/office-desk-band.svg" alt="">
      <img src="devices/desktop-monitor.svg" alt="">
      <img src="devices/keyboard-mouse.svg" alt="">
      <img src="props/rubber-duck.svg" alt="" style="left:209.5px;top:290.5px;">
      <img src="hands/pov-hands-keyboard.svg" alt="">
    </div>
    <figcaption>Văn phòng, nhìn vào màn hình: tường → mặt bàn → màn hình → bàn phím → vịt → tay</figcaption>
  </figure>
  <figure>
    <div class="scene">
      <img src="backgrounds/office-wall-wide.svg" alt="" style="left:-181.5px;">
      <img src="backgrounds/office-desk-band.svg" alt="" style="left:-330px;">
      <img src="characters/coworker-mai.svg" alt="" style="left:-25px;">
    </div>
    <figcaption>Văn phòng, quay sang đồng nghiệp: camera lia sang x = 1320, tường lia chậm hơn (0,55)</figcaption>
  </figure>
  <figure>
    <div class="scene">
      <img src="backgrounds/study-desk-night.svg" alt="">
      <img src="devices/smartphone.svg" alt="">
      <img src="hands/pov-hands-phone.svg" alt="">
    </div>
    <figcaption>Bàn học buổi tối, cầm điện thoại: nền → điện thoại → tay</figcaption>
  </figure>
</div>

<h1 style="margin-top:28px;">Đồ vật và icon</h1>
<div class="row">
  <figure><div class="item"><img src="props/rubber-duck.svg" alt=""></div><figcaption>props/rubber-duck</figcaption></figure>
  <figure><div class="item"><img src="icons/idea-bulb.svg" alt=""></div><figcaption>icons/idea-bulb</figcaption></figure>
  <figure><div class="item"><img src="icons/arrow-curved.svg" alt=""></div><figcaption>icons/arrow-curved</figcaption></figure>
  <figure><div class="item"><img src="icons/success-tick.svg" alt=""></div><figcaption>icons/success-tick</figcaption></figure>
  <figure>
    <div class="icons">
      <span title="edu"><img src="icons/career-groups/edu.svg" alt=""></span>
      <span title="art"><img src="icons/career-groups/art.svg" alt=""></span>
      <span title="soc"><img src="icons/career-groups/soc.svg" alt=""></span>
      <span title="bus"><img src="icons/career-groups/bus.svg" alt=""></span>
      <span title="nat"><img src="icons/career-groups/nat.svg" alt=""></span>
      <span title="ict"><img src="icons/career-groups/ict.svg" alt=""></span>
      <span title="eng"><img src="icons/career-groups/eng.svg" alt=""></span>
      <span title="agr"><img src="icons/career-groups/agr.svg" alt=""></span>
      <span title="hea"><img src="icons/career-groups/hea.svg" alt=""></span>
      <span title="ser"><img src="icons/career-groups/ser.svg" alt=""></span>
      <span title="person"><img src="icons/career-groups/person.svg" alt=""></span>
    </div>
    <figcaption>icons/career-groups/*: nét vẽ theo <code>currentColor</code>, nên khi chèn thẳng SVG vào trang thì đổi màu bằng CSS <code>color</code> (ở đây hiển thị dạng ảnh nên nét màu đen)</figcaption>
  </figure>
</div>
</body>
</html>
